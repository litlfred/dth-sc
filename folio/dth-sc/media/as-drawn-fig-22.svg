<g font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Arial,sans-serif" fill="#000000">
<text x="512.65" y="14.81" font-size="8" fill="#1C254E" textLength="11.94" lengthAdjust="spacingAndGlyphs">Fig.</text>
<text x="511.43" y="26.81" font-size="14" font-weight="700" fill="#1C254E" textLength="14.39" lengthAdjust="spacingAndGlyphs">22</text>
<text x="21.04" y="78.07" font-size="10" font-weight="700" fill="#FFFFFF" textLength="138.83" lengthAdjust="spacingAndGlyphs">LEADERSHIP AND GOVERNANCE</text>
<text x="21.04" y="115.15" font-size="10" font-weight="700" fill="#FFFFFF" textLength="65.37" lengthAdjust="spacingAndGlyphs">STRATEGY AND</text>
<text x="21.04" y="126.15" font-size="10" font-weight="700" fill="#FFFFFF" textLength="56.93" lengthAdjust="spacingAndGlyphs">INVESTMENT</text>
<text x="123.09" y="116.23" font-size="10" font-weight="700" fill="#FFFFFF" textLength="129.48" lengthAdjust="spacingAndGlyphs">SERVICES AND APPLICATIONS</text>
<text x="299.03" y="110.9" font-size="10" font-weight="700" fill="#FFFFFF" textLength="60.79" lengthAdjust="spacingAndGlyphs">LEGISLATION,</text>
<text x="299.03" y="121.9" font-size="10" font-weight="700" fill="#FFFFFF" textLength="54.51" lengthAdjust="spacingAndGlyphs">POLICY, AND</text>
<text x="299.03" y="132.9" font-size="10" font-weight="700" fill="#FFFFFF" textLength="57.74" lengthAdjust="spacingAndGlyphs">COMPLIANCE</text>
<text x="401.08" y="110.9" font-size="10" font-weight="700" fill="#FFFFFF" textLength="56.65" lengthAdjust="spacingAndGlyphs">WORKFORCE</text>
<text x="123.09" y="156.97" font-size="10" font-weight="700" fill="#FFFFFF" textLength="160.42" lengthAdjust="spacingAndGlyphs">STANDARDS AND INTEROPERABILITY</text>
<text x="123.09" y="197.71" font-size="10" font-weight="700" fill="#FFFFFF" textLength="79.9" lengthAdjust="spacingAndGlyphs">INFRASTRUCTURE</text>
<text x="-0.4" y="269.13" font-size="10" fill="#231F20" textLength="477.93" lengthAdjust="spacingAndGlyphs">Table 2 provides illustrative considerations for each building block to help ensure successful DHSC implementation.</text>
<text x="237.43" y="226.87" font-size="8" font-style="italic" fill="#231F20" textLength="22.22" lengthAdjust="spacingAndGlyphs">Source</text>
<text x="259.65" y="226.87" font-size="8" fill="#231F20" textLength="111.58" lengthAdjust="spacingAndGlyphs">: adapted from the 2012 WHO-ITU</text>
<text x="372.84" y="226.87" font-size="8" font-style="italic" fill="#231F20" textLength="108.68" lengthAdjust="spacingAndGlyphs">National eHealth Strategy Toolkit</text>
<text x="483.11" y="226.87" font-size="8" font-style="italic" fill="#231F20" textLength="12.35" lengthAdjust="spacingAndGlyphs">(19)</text>
<text x="495.47" y="226.87" font-size="8" fill="#231F20" textLength="1.99" lengthAdjust="spacingAndGlyphs">.</text>
<text x="6.12" y="325.3" font-size="10" font-weight="700" fill="#1C254E" textLength="107.75" lengthAdjust="spacingAndGlyphs">WHAT IS GOVERNANCE?</text>
<text x="6.12" y="339.3" font-size="10" fill="#231F20" textLength="169.05" lengthAdjust="spacingAndGlyphs">In the context of the health supply chain,</text>
<a href="https://litlfred.github.io/smart-ra/v0/ns/glossary/dpi-h-ra/governance"><title>https://litlfred.github.io/smart-ra/v0/ns/glossary/dpi-h-ra/governance</title><text x="177.17" y="339.3" font-size="10" font-style="italic" fill="#231F20" textLength="47.93" lengthAdjust="spacingAndGlyphs">governance</text></a>
<text x="227.1" y="339.3" font-size="10" fill="#231F20" textLength="283.83" lengthAdjust="spacingAndGlyphs">is the process of establishing and implementing policies, procedures</text>
<text x="6.12" y="353.3" font-size="10" fill="#231F20" textLength="485.89" lengthAdjust="spacingAndGlyphs">and mechanisms to ensure that the supply chain processes and the systems to manage those processes are managed</text>
<text x="6.12" y="367.3" font-size="10" fill="#231F20" textLength="504.21" lengthAdjust="spacingAndGlyphs">effectively, ethically and in alignment with established objectives and stakeholders’ interests. It involves decision-making,</text>
<text x="6.12" y="381.3" font-size="10" fill="#231F20" textLength="505.55" lengthAdjust="spacingAndGlyphs">defining roles and responsibilities, setting goals and objectives, and monitoring performance to ensure accountability and</text>
<text x="6.12" y="395.3" font-size="10" fill="#231F20" textLength="181.9" lengthAdjust="spacingAndGlyphs">compliance with regulations and standards.</text>
</g>
</svg>
