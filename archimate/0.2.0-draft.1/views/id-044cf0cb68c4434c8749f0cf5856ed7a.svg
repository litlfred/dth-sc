<g class="av-legend"><rect x="56" y="785" width="660" height="204" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="66" y="803">Key</text><text class="av-keyh" x="66" y="819">Colour: which part of the architecture a box belongs to</text><rect x="66" y="828" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="124" y="839">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="66" y="859">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="66" y="867" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="124" y="883">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="66" y="909">Other marks</text><rect x="66" y="918" width="44" height="14" fill="#f2f2f2" stroke="#888"/><text class="av-key" x="124" y="929">Grey band: a grouping for layout only; it adds no meaning</text><text class="av-keyh" x="66" y="949">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M76 965 L108 965" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="124" y="969">Flow: passes something, such as information, to</text></g></svg>
