<g class="av-legend"><rect x="268" y="854" width="660" height="384" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="278" y="872">Key</text><text class="av-keyh" x="278" y="888">Colour: which part of the architecture a box belongs to</text><rect x="278" y="897" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="336" y="908">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="278" y="917" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="336" y="928">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="278" y="937" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="336" y="948">Software: systems and their parts, the services they offer, and the data they hold</text><rect x="278" y="957" width="44" height="14" fill="#ffffff" stroke="#8c8c8c"/><text class="av-key" x="336" y="968">Other: groupings, locations and junctions</text><text class="av-keyh" x="278" y="988">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="278" y="996" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="336" y="1012">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="278" y="1026" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="336" y="1042">Rounded ends: a service, offered for others to use</text><rect x="278" y="1056" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="336" y="1072">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="278" y="1098">Other marks</text><rect x="278" y="1105" width="44" height="18" fill="#fff" stroke="#555"/><rect x="288" y="1110" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="336" y="1118">A box inside another box: a part of it</text><rect x="278" y="1127" width="44" height="14" fill="#f2f2f2" stroke="#888"/><text class="av-key" x="336" y="1138">Grey band: a grouping for layout only; it adds no meaning</text><text class="av-keyh" x="278" y="1158">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M288 1174 L320 1174" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="336" y="1178">Realization: makes real, or achieves</text><path d="M288 1194 L320 1194" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="336" y="1198">Serving: serves (provides what the end needs)</text><path d="M288 1214 L320 1214" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="336" y="1218">Access: reads or writes data (the arrow shows which way the data goes)</text></g></svg>
