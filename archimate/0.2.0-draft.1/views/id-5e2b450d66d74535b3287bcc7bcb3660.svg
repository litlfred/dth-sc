<g class="av-legend"><rect x="125" y="623" width="660" height="264" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="135" y="641">Key</text><text class="av-keyh" x="135" y="657">Colour: which part of the architecture a box belongs to</text><rect x="135" y="666" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="193" y="677">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><text class="av-keyh" x="135" y="697">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="141,705 173,705 179,711 179,723 173,729 141,729 135,723 135,711" fill="#fff" stroke="#555"/><text class="av-key" x="193" y="721">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><text class="av-keyh" x="135" y="747">Other marks</text><rect x="135" y="754" width="44" height="18" fill="#fff" stroke="#555"/><rect x="145" y="759" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="193" y="767">A box inside another box: a part of it</text><rect x="135" y="776" width="44" height="14" fill="#f2f2f2" stroke="#888"/><text class="av-key" x="193" y="787">Grey band: a grouping for layout only; it adds no meaning</text><text class="av-keyh" x="135" y="807">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M145 823 L177 823" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="193" y="827">Realization: makes real, or achieves</text><path d="M145 843 L177 843" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-open)"/><text class="av-key" x="193" y="847">Influence: influences, or contributes to</text><path d="M145 863 L177 863" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="193" y="867">Association: is related to (no more specific meaning)</text></g></svg>
