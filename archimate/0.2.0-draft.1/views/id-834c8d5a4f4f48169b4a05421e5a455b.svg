<g class="av-legend"><rect x="78" y="557" width="660" height="244" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="88" y="575">Key</text><text class="av-keyh" x="88" y="591">Colour: which part of the architecture a box belongs to</text><rect x="88" y="600" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="146" y="611">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><text class="av-keyh" x="88" y="631">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="94,639 126,639 132,645 132,657 126,663 94,663 88,657 88,645" fill="#fff" stroke="#555"/><text class="av-key" x="146" y="655">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><text class="av-keyh" x="88" y="681">Other marks</text><rect x="88" y="690" width="44" height="14" fill="#f2f2f2" stroke="#888"/><text class="av-key" x="146" y="701">Grey band: a grouping for layout only; it adds no meaning</text><text class="av-keyh" x="88" y="721">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M98 737 L130 737" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="146" y="741">Realization: makes real, or achieves</text><path d="M98 757 L130 757" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-open)"/><text class="av-key" x="146" y="761">Influence: influences, or contributes to</text><path d="M98 777 L130 777" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="146" y="781">Association: is related to (no more specific meaning)</text></g></svg>
