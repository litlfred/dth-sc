<g class="av-legend"><rect x="170" y="635" width="660" height="244" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="180" y="653">Key</text><text class="av-keyh" x="180" y="669">Colour: which part of the architecture a box belongs to</text><rect x="180" y="678" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="238" y="689">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><text class="av-keyh" x="180" y="709">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="186,717 218,717 224,723 224,735 218,741 186,741 180,735 180,723" fill="#fff" stroke="#555"/><text class="av-key" x="238" y="733">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><text class="av-keyh" x="180" y="759">Other marks</text><rect x="180" y="768" width="44" height="14" fill="#f2f2f2" stroke="#888"/><text class="av-key" x="238" y="779">Grey band: a grouping for layout only; it adds no meaning</text><text class="av-keyh" x="180" y="799">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M190 815 L222 815" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="238" y="819">Realization: makes real, or achieves</text><path d="M190 835 L222 835" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-open)"/><text class="av-key" x="238" y="839">Influence: influences, or contributes to</text><path d="M190 855 L222 855" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="238" y="859">Association: is related to (no more specific meaning)</text></g></svg>
