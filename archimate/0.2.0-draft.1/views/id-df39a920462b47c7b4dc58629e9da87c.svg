<g class="av-legend"><rect x="147" y="645" width="660" height="244" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="157" y="663">Key</text><text class="av-keyh" x="157" y="679">Colour: which part of the architecture a box belongs to</text><rect x="157" y="688" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="215" y="699">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><text class="av-keyh" x="157" y="719">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="163,727 195,727 201,733 201,745 195,751 163,751 157,745 157,733" fill="#fff" stroke="#555"/><text class="av-key" x="215" y="743">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><text class="av-keyh" x="157" y="769">Other marks</text><rect x="157" y="778" width="44" height="14" fill="#f2f2f2" stroke="#888"/><text class="av-key" x="215" y="789">Grey band: a grouping for layout only; it adds no meaning</text><text class="av-keyh" x="157" y="809">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M167 825 L199 825" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="215" y="829">Realization: makes real, or achieves</text><path d="M167 845 L199 845" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-open)"/><text class="av-key" x="215" y="849">Influence: influences, or contributes to</text><path d="M167 865 L199 865" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="215" y="869">Association: is related to (no more specific meaning)</text></g></svg>
