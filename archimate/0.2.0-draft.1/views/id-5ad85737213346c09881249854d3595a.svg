<g class="av-legend"><rect x="161" y="641" width="660" height="244" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="171" y="659">Key</text><text class="av-keyh" x="171" y="675">Colour: which part of the architecture a box belongs to</text><rect x="171" y="684" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="229" y="695">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><text class="av-keyh" x="171" y="715">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="177,723 209,723 215,729 215,741 209,747 177,747 171,741 171,729" fill="#fff" stroke="#555"/><text class="av-key" x="229" y="739">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><text class="av-keyh" x="171" y="765">Other marks</text><rect x="171" y="774" width="44" height="14" fill="#f2f2f2" stroke="#888"/><text class="av-key" x="229" y="785">Grey band: a grouping for layout only; it adds no meaning</text><text class="av-keyh" x="171" y="805">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M181 821 L213 821" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="229" y="825">Realization: makes real, or achieves</text><path d="M181 841 L213 841" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-open)"/><text class="av-key" x="229" y="845">Influence: influences, or contributes to</text><path d="M181 861 L213 861" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="229" y="865">Association: is related to (no more specific meaning)</text></g></svg>
