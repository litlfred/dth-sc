<g class="av-legend"><rect x="602" y="665" width="660" height="334" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="612" y="683">Key</text><text class="av-keyh" x="612" y="699">Colour: which part of the architecture a box belongs to</text><rect x="612" y="708" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="670" y="719">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><rect x="612" y="728" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="670" y="739">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="612" y="748" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="670" y="759">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="612" y="768" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="670" y="779">Software: systems and their parts, the services they offer, and the data they hold</text><rect x="612" y="788" width="44" height="14" fill="#ffffff" stroke="#8c8c8c"/><text class="av-key" x="670" y="799">Other: groupings, locations and junctions</text><text class="av-keyh" x="612" y="819">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="618,827 650,827 656,833 656,845 650,851 618,851 612,845 612,833" fill="#fff" stroke="#555"/><text class="av-key" x="670" y="843">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><rect x="612" y="857" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="670" y="873">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="612" y="887" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="670" y="903">Rounded ends: a service, offered for others to use</text><rect x="612" y="917" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="670" y="933">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="612" y="959">Other marks</text><rect x="612" y="966" width="44" height="18" fill="#fff" stroke="#555"/><rect x="622" y="971" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="670" y="979">A box inside another box: a part of it</text></g></svg>
