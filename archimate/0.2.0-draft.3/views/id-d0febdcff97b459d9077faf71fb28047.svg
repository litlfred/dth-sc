<g class="av-legend"><rect x="602" y="665" width="829" height="334" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="612" y="683">Key</text><text class="av-keyh" x="612" y="699">Colour: which part of the architecture a box belongs to</text><rect x="612" y="708" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="670" y="719">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><rect x="612" y="728" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="670" y="739">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="612" y="748" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="670" y="759">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="612" y="768" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="670" y="779">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="612" y="799">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="618,807 650,807 656,813 656,825 650,831 618,831 612,825 612,813" fill="#fff" stroke="#555"/><text class="av-key" x="670" y="823">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><rect x="612" y="837" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="670" y="853">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="612" y="867" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="670" y="883">Rounded ends: a service, offered for others to use</text><rect x="612" y="897" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="670" y="913">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="612" y="939">Other marks</text><rect x="612" y="946" width="44" height="18" fill="#fff" stroke="#555"/><rect x="622" y="951" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="670" y="959">A box inside another box: a part of it</text><rect x="612" y="968" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="612" y="968" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="670" y="979">Band with a dark header: a grouping for layout only; it adds no meaning (tinted in the layer most of its boxes belong to)</text></g></svg>
