<g class="av-legend"><rect x="194" y="743" width="660" height="374" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="204" y="761">Key</text><text class="av-keyh" x="204" y="777">Colour: which part of the architecture a box belongs to</text><rect x="204" y="786" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="262" y="797">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="204" y="806" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="262" y="817">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="204" y="826" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="262" y="837">Software: systems and their parts, the services they offer, and the data they hold</text><rect x="204" y="846" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="262" y="857">Technology: the devices, platforms and networks the software runs on</text><text class="av-keyh" x="204" y="877">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="204" y="885" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="901">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="204" y="915" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="931">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="204" y="957">Other marks</text><rect x="204" y="964" width="44" height="18" fill="#fff" stroke="#555"/><rect x="214" y="969" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="977">A box inside another box: a part of it</text><rect x="204" y="986" width="44" height="14" fill="#f2f2f2" stroke="#888"/><text class="av-key" x="262" y="997">Grey band: a grouping for layout only; it adds no meaning</text><text class="av-keyh" x="204" y="1017">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M214 1033 L246 1033" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1037">Realization: makes real, or achieves</text><path d="M214 1053 L246 1053" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="262" y="1057">Flow: passes something, such as information, to</text><path d="M214 1073 L246 1073" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1077">Specialization: is a kind of</text><path d="M214 1093 L246 1093" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="262" y="1097">Association: is related to (no more specific meaning)</text></g></svg>
