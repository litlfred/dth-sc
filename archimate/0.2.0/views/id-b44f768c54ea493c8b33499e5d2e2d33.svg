<g class="av-legend"><rect x="266" y="407" width="660" height="194" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="276" y="425">Key</text><text class="av-keyh" x="276" y="441">Colour: which part of the architecture a box belongs to</text><rect x="276" y="450" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="334" y="461">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="276" y="481">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="276" y="489" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="334" y="505">Rounded ends: a service, offered for others to use</text><rect x="276" y="519" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="334" y="535">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="276" y="561">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M286 577 L318 577" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="334" y="581">Realization: makes real, or achieves</text></g></svg>
