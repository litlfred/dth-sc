<g class="av-legend"><rect x="254" y="533" width="660" height="334" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="264" y="551">Key</text><text class="av-keyh" x="264" y="567">Colour: which part of the architecture a box belongs to</text><rect x="264" y="576" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="322" y="587">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><rect x="264" y="596" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="322" y="607">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="264" y="616" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="322" y="627">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="264" y="636" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="322" y="647">Software: systems and their parts, the services they offer, and the data they hold</text><rect x="264" y="656" width="44" height="14" fill="#ffffff" stroke="#8c8c8c"/><text class="av-key" x="322" y="667">Other: groupings, locations and junctions</text><text class="av-keyh" x="264" y="687">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="270,695 302,695 308,701 308,713 302,719 270,719 264,713 264,701" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="711">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><rect x="264" y="725" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="741">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="264" y="755" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="771">Rounded ends: a service, offered for others to use</text><rect x="264" y="785" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="801">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="264" y="827">Other marks</text><rect x="264" y="834" width="44" height="18" fill="#fff" stroke="#555"/><rect x="274" y="839" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="847">A box inside another box: a part of it</text></g></svg>
