e end needs)</text><path d="M250 845 L282 845" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#dot)" marker-end="url(#arrow-filled)"/><text class="av-key" x="298" y="849">Assignment: is assigned to, or carries out</text><path d="M250 865 L282 865" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-filled)"/><text class="av-key" x="298" y="869">Triggering: triggers (happens first, and starts the end)</text></g></svg>
