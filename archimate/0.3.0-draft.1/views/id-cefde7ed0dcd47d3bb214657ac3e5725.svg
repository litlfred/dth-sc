<g class="av-legend"><rect x="614" y="461" width="660" height="274" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="624" y="479">Key</text><text class="av-keyh" x="624" y="495">Colour: which part of the architecture a box belongs to</text><rect x="624" y="504" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="682" y="515">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="624" y="524" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="682" y="535">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="624" y="544" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="682" y="555">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="624" y="575">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="624" y="583" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="682" y="599">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="624" y="613" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="682" y="629">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="624" y="655">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M634 671 L666 671" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="682" y="675">Realization: makes real, or achieves</text><path d="M634 691 L666 691" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="682" y="695">Access: reads or writes data (the arrow shows which way the data goes)</text><path d="M634 711 L666 711" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="682" y="715">Association: is related to (no more specific meaning)</text></g></svg>
