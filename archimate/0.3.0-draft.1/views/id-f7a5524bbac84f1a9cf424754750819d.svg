<g class="av-legend"><rect x="218" y="755" width="660" height="304" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="228" y="773">Key</text><text class="av-keyh" x="228" y="789">Colour: which part of the architecture a box belongs to</text><rect x="228" y="798" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="286" y="809">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="228" y="818" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="286" y="829">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="228" y="838" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="286" y="849">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="228" y="869">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="228" y="877" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="286" y="893">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="228" y="907" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="286" y="923">Rounded ends: a service, offered for others to use</text><rect x="228" y="937" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="286" y="953">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="228" y="979">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M238 995 L270 995" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="286" y="999">Serving: serves (provides what the end needs)</text><path d="M238 1015 L270 1015" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="286" y="1019">Flow: passes something, such as information, to</text><path d="M238 1035 L270 1035" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="286" y="1039">Association: is related to (no more specific meaning)</text></g></svg>
