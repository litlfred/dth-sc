<g class="av-legend"><rect x="14" y="561" width="660" height="314" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="579">Key</text><text class="av-keyh" x="24" y="595">Colour: which part of the architecture a box belongs to</text><rect x="24" y="604" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="615">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="24" y="624" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="635">Software: systems and their parts, the services they offer, and the data they hold</text><rect x="24" y="644" width="44" height="14" fill="#ffffff" stroke="#8c8c8c"/><text class="av-key" x="82" y="655">Other: groupings, locations and junctions</text><text class="av-keyh" x="24" y="675">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="24" y="683" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="699">Rounded ends: a service, offered for others to use</text><rect x="24" y="713" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="729">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="24" y="755">Other marks</text><rect x="24" y="762" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="767" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="775">A box inside another box: a part of it</text><text class="av-keyh" x="24" y="795">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M34 811 L66 811" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="82" y="815">Serving: serves (provides what the end needs)</text><path d="M34 831 L66 831" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="82" y="835">Access: reads or writes data (the arrow shows which way the data goes)</text><path d="M34 851 L66 851" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="82" y="855">Flow: passes something, such as information, to</text></g></svg>
