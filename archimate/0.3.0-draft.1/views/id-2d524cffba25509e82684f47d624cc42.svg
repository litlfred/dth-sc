<g class="av-legend"><rect x="14" y="360" width="660" height="284" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="378">Key</text><text class="av-keyh" x="24" y="394">Colour: which part of the architecture a box belongs to</text><rect x="24" y="403" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="82" y="414">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><rect x="24" y="423" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="434">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="24" y="443" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="454">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="24" y="463" width="44" height="14" fill="#ffffff" stroke="#8c8c8c"/><text class="av-key" x="82" y="474">Other: groupings, locations and junctions</text><text class="av-keyh" x="24" y="494">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="30,502 62,502 68,508 68,520 62,526 30,526 24,520 24,508" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="518">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><rect x="24" y="532" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="548">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="24" y="562" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="578">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="24" y="604">Other marks</text><rect x="24" y="611" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="616" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="624">A box inside another box: a part of it</text></g></svg>
