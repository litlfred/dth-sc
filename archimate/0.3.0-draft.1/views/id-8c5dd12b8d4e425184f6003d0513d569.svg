<g class="av-legend"><rect x="194" y="947" width="660" height="424" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="204" y="965">Key</text><text class="av-keyh" x="204" y="981">Colour: which part of the architecture a box belongs to</text><rect x="204" y="990" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="262" y="1001">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="204" y="1010" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="262" y="1021">Software: systems and their parts, the services they offer, and the data they hold</text><rect x="204" y="1030" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="262" y="1041">Technology: the devices, platforms and networks the software runs on</text><text class="av-keyh" x="204" y="1061">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="204" y="1069" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1085">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="204" y="1099" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1115">Rounded ends: a service, offered for others to use</text><rect x="204" y="1129" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1145">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="204" y="1171">Other marks</text><rect x="204" y="1178" width="44" height="18" fill="#fff" stroke="#555"/><rect x="214" y="1183" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1191">A box inside another box: a part of it</text><text class="av-keyh" x="204" y="1211">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M214 1227 L246 1227" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1231">Realization: makes real, or achieves</text><path d="M214 1247 L246 1247" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="262" y="1251">Serving: serves (provides what the end needs)</text><path d="M214 1267 L246 1267" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#diamond-filled)"/><text class="av-key" x="262" y="1271">Composition: is made up of (the end is a part that cannot exist without the start)</text><path d="M214 1287 L246 1287" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#diamond-hollow)"/><text class="av-key" x="262" y="1291">Aggregation: groups (the end is a part that can also exist on its own)</text><path d="M214 1307 L246 1307" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="262" y="1311">Access: reads or writes data (the arrow shows which way the data goes)</text><path d="M214 1327 L246 1327" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1331">Specialization: is a kind of</text><path d="M214 1347 L246 1347" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="262" y="1351">Association: is related to (no more specific meaning)</text></g></svg>
