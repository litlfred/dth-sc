<g class="av-legend"><rect x="192" y="412" width="660" height="274" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="202" y="430">Key</text><text class="av-keyh" x="202" y="446">Colour: which part of the architecture a box belongs to</text><rect x="202" y="455" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="260" y="466">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><rect x="202" y="475" width="44" height="14" fill="#ffffff" stroke="#8c8c8c"/><text class="av-key" x="260" y="486">Other: groupings, locations and junctions</text><text class="av-keyh" x="202" y="506">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="208,514 240,514 246,520 246,532 240,538 208,538 202,532 202,520" fill="#fff" stroke="#555"/><text class="av-key" x="260" y="530">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><rect x="202" y="544" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="260" y="560">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="202" y="586">Other marks</text><rect x="202" y="593" width="44" height="18" fill="#fff" stroke="#555"/><rect x="212" y="598" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="260" y="606">A box inside another box: a part of it</text><polygon points="202,615 240,615 246,621 246,629 202,629" fill="#fff" stroke="#888"/><text class="av-key" x="260" y="626">Note: a comment from the authors</text><text class="av-keyh" x="202" y="646">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M212 662 L244 662" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#diamond-filled)"/><text class="av-key" x="260" y="666">Composition: is made up of (the end is a part that cannot exist without the start)</text></g></svg>
